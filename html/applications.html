<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobOS - Applications</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/applications.css">
    <script src="../js/applications.js" defer></script>
</head>

<body id="applications-page">

    <header id="header">
        <nav id="navbar">
            <a class="logo" href="index.html">JobOS</a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="applications.html" class="active">Applications</a></li>
            </ul>
        </nav>
    </header>



    <main class="applications-main">

    <div class="page-header">
        <div>
            <h1>Your Applications</h1>
            <p>Manage and track all your job applications.</p>
        </div>
        <div id="input-field">
            <input id="url" type="url" placeholder="Paste URL here" >
            <button id="url-btn" type="button">Add Application</button>
        </div>
    </div>

        

        <section class="applications-panel">
            <table id="applications-table">
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Summary</th>
                        <th>Pensum</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th>URL</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                
                <tbody id="applications-body">
           
                </tbody>
            </table>
        </section>

    </main>


</body>
</html>
